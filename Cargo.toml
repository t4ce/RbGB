[package]
name = "rbgb"
version = "0.2.1"
edition = "2024"
authors = ["Noah Graf <noah@grafhome.net>"]
description = "A basic and rough gameboy emulator"
license = "MIT"
repository = "https://github.com/ngraf3255/RbGB"

[lib]
name = "rbgb"
path = "src/lib.rs"

[[bin]]
name = "rbgb"
path = "src/main.rs"
test = false
bench = false

[dependencies]
trueos = { workspace = true, features = ["ui4-scene"] }

[features]
default = []
std = []
